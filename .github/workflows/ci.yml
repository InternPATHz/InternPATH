name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma Client ของแต่ละ Service ต้อง generate ก่อน lint/test/build
      - name: Prisma generate
        run: |
          pnpm --filter @internpath/verification prisma:generate
          pnpm --filter @internpath/identity prisma:generate
      # รันเฉพาะแพ็กเกจที่เปลี่ยน (และที่พึ่งพามัน) เทียบกับ main
      - name: Lint
        run: pnpm --filter "...[origin/main]" --if-present lint
      - name: Test
        run: pnpm --filter "...[origin/main]" --if-present test
      - name: Build
        run: pnpm --filter "...[origin/main]" --if-present build
