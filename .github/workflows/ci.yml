name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma Client ของทุก Service ต้อง generate ก่อน lint/test/build — ขั้นเดียวครอบทุก apps/* ที่มีสคริปต์ prisma:generate
      # (Service ใหม่ไม่ต้องแก้ไฟล์นี้) ทุก Service ต้องตั้ง `output = "../generated/client"` ใน schema.prisma
      # ไม่เช่นนั้น Client จะเขียนทับกัน — มีเทสต์ตรวจใน libs/common (test/repo/prisma-outputs.spec.ts)
      - name: Prisma generate
        run: pnpm --filter "./apps/*" --if-present prisma:generate
      # รันเฉพาะแพ็กเกจที่เปลี่ยน (และที่พึ่งพามัน) เทียบกับ main
      - name: Lint
        run: pnpm --filter "...[origin/main]" --if-present lint
      # เทสต์ PDF จริงของ Lifecycle (E-Certificate) ไม่ถูกลงทะเบียนถ้าไม่มี Chromium และ RUN_PDF_TESTS=true
      # ติดตั้งแล้วค่อยรัน เพื่อไม่ให้ CI เขียวทั้งที่ไม่ได้ทดสอบ PDF
      - name: Install Chromium (Lifecycle PDF tests)
        run: pnpm --filter @internpath/lifecycle exec playwright install --with-deps chromium
      - name: Test
        run: pnpm --filter "...[origin/main]" --if-present test
        env:
          RUN_PDF_TESTS: 'true'
      - name: Build
        run: pnpm --filter "...[origin/main]" --if-present build

  identity-gateway-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: internpath
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: internpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U internpath -d internpath"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: internpath
          RABBITMQ_DEFAULT_PASS: ci-only-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      IDENTITY_IT_ADMIN_URL: postgresql://internpath:ci-only-password@127.0.0.1:5432/postgres
      RABBITMQ_URL: amqp://internpath:ci-only-password@127.0.0.1:5672
      RUN_RABBITMQ_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @internpath/identity prisma:generate
      # --forbid-pending ทำให้ job ล้มถ้า suite ข้ามเพราะต่อ Postgres/RabbitMQ ไม่ได้
      - name: Identity integration tests
        run: pnpm --filter @internpath/identity exec mocha --forbid-pending
      - name: Gateway RabbitMQ integration tests
        run: pnpm --filter @internpath/gateway exec mocha --forbid-pending

  # เทสต์ที่ต้องใช้ Postgres/RabbitMQ จริงของ Lifecycle, Job, Verification — job `check` ข้ามเทสต์เหล่านี้เงียบๆ เพราะไม่มี DB
  # --forbid-pending ทำให้ job ล้มถ้ามี suite ข้าม (เช่น ต่อ Postgres/RabbitMQ ไม่ได้) จึงไม่มีทางผ่านโดยไม่ได้รันจริง
  service-integration:
    name: integration (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [lifecycle, job, verification]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: internpath
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: internpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U internpath -d internpath"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: internpath
          RABBITMQ_DEFAULT_PASS: ci-only-password
        ports:
          - 5672:5672
          # Job สร้าง vhost แยกต่อเทสต์ผ่าน Management API
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LIFECYCLE_IT_ADMIN_URL: postgresql://internpath:ci-only-password@127.0.0.1:5432/postgres
      JOB_IT_ADMIN_URL: postgresql://internpath:ci-only-password@127.0.0.1:5432/postgres
      VERIFICATION_IT_ADMIN_URL: postgresql://internpath:ci-only-password@127.0.0.1:5432/postgres
      RABBITMQ_URL: amqp://internpath:ci-only-password@127.0.0.1:5672
      RUN_RABBITMQ_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @internpath/${{ matrix.service }} prisma:generate
      - name: Integration tests (${{ matrix.service }})
        run: pnpm --filter @internpath/${{ matrix.service }} exec mocha --forbid-pending
